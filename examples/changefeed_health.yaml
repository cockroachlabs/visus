# Privileges: beyond what "visus init" grants, [SHOW CHANGEFEED JOBS] needs
#   GRANT SYSTEM VIEWJOB TO visus;
# otherwise it only returns jobs the visus user owns.
#
# lag_seconds is -1 for a changefeed that has no checkpoint yet
# (high_water_timestamp is NULL). Canceled and failed changefeeds stay in
# [SHOW CHANGEFEED JOBS] for 12h with a lag_seconds that keeps growing, so
# alerts should filter on status="running".
#
# target_tables/target_database come from full_table_names, always
# fully-qualified as "database.schema.table"; target_database only reflects
# the first table, so it's wrong for changefeeds spanning multiple
# databases. database_name isn't used: it's always NULL today, reserved
# for CREATE CHANGEFEED FOR DATABASE, which isn't implemented yet (CRDB
# issue 154053). full_table_names also re-resolves descriptor IDs live, so
# a since-dropped table/database can show up as NULL or as bracketed IDs
# (e.g. "[123].[456].foo") instead of its original name.
#
name: changefeed_health
enabled: false
scope: cluster
frequency: 30
maxresults: 200
labels: [job_id, status, sink_type, target_tables, target_database]
metrics:
  - name : lag_seconds
    kind : gauge
    help : seconds between the changefeed's high-water mark and now; -1 before the first checkpoint.
query:
  SELECT
      job_id::STRING AS job_id,
      status,
      coalesce(regexp_extract(description, $$INTO '([a-zA-Z0-9+-]+):$$), '') AS sink_type,
      coalesce(array_to_string(full_table_names, ', '), '') AS target_tables,
      coalesce(split_part(full_table_names[1], '.', 1), '') AS target_database,
      CASE WHEN high_water_timestamp IS NULL THEN -1
           ELSE extract(epoch FROM now() - hlc_to_timestamp(high_water_timestamp))
      END::FLOAT AS lag_seconds
  FROM
      [SHOW CHANGEFEED JOBS]
  LIMIT
    $1;
