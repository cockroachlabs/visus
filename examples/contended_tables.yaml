# Privileges: beyond what "visus init" grants, the visus user needs SELECT on
# the tables it reports on. CockroachDB v24.3 hides rows in crdb_internal for
# tables the user cannot read; later versions do not filter.

name: contended_tables
enabled: true
scope: cluster
frequency: 10
maxresults: 100
labels: [database_name,schema_name,table_name]
metrics:
  - name : num_events
    kind : counter
    help : number of num_contention_events.
query: 
    SELECT
      database_name, schema_name, table_name, num_contention_events as num_events
    FROM 
      crdb_internal.cluster_contended_tables
    WHERE
      database_name IS NOT NULL  
    LIMIT $1;
