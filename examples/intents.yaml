# Privileges: beyond what "visus init" grants, the visus user needs SELECT on
# the tables it reports on. CockroachDB v24.3 hides rows in crdb_internal for
# tables the user cannot read; later versions do not filter.

# crdb_internal.ranges_no_leases lost its table_id column in v23.1, so the
# table id is parsed out of start_pretty instead, matching table_mvcc.yaml.
name: intent
enabled: true
scope: cluster
frequency: 10
maxresults: 100
labels: [table_name]
metrics:
  - name : count
    kind : counter
    help : number of intents.
query:
  SELECT table_name, intent_count as count
  FROM (
          SELECT t.name as table_name,
                 sum(
                    (crdb_internal.range_stats(r.start_key)->'intent_count')::INT8
                 ) AS intent_count
            FROM crdb_internal.ranges_no_leases AS r
            JOIN crdb_internal.tables AS t ON (
                CASE
                    WHEN strpos(substring(r.start_pretty, 8), '/') > 0
                    THEN substring(r.start_pretty, 8, strpos(substring(r.start_pretty, 8), '/') - 1)
                    ELSE substring(r.start_pretty, 8)
                    END
                )::INT8 = t.table_id
           WHERE r.start_pretty::STRING LIKE '/Table/%'
        GROUP BY t.name
       ) AS inline
 WHERE intent_count > 0
 LIMIT $1;
