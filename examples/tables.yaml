# Privileges: beyond what "visus init" grants, the visus user needs SELECT on
# the tables it reports on. CockroachDB v24.3 hides rows in crdb_internal for
# tables the user cannot read; later versions do not filter.

name: tables
enabled: true
scope: cluster
frequency: 60
maxresults: 100
labels: [database_name, state]
metrics:
  - name : num
    kind : gauge
    help : number of tables per database
query:  
  SELECT
      database_name::string,
      state,
      count(*)::float as num
  FROM
      crdb_internal.tables
  WHERE
      database_name IS NOT NULL    
  GROUP BY
      1, 2
  ORDER BY
      3 DESC
  LIMIT
      $1;
